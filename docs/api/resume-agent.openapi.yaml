openapi: 3.1.0
info:
  title: YAMLResume Agent API
  version: 1.0.0
  description: |
    Backend API for evidence-grounded, job-tailored resume generation.
    Every response carries a request ID. Binary artifacts are Base64 in the
    synchronous MVP; production deployments should replace large inline
    artifacts with short-lived object-storage URLs.
servers:
  - url: http://localhost:8787
    description: Local development
tags:
  - name: System
  - name: Authentication
  - name: Provider Credentials
  - name: Resume Agent
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check that the HTTP process is available
      responses:
        '200':
          description: Process is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Health'
  /v1/capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      summary: Discover supported inputs, limits, styles, and output formats
      responses:
        '200':
          description: Frontend capability descriptor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Capabilities'
  /v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Create a local account and issue an opaque session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '201':
          description: Account created and HttpOnly session cookie issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: An account already exists for the canonical email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Verify credentials and issue a new opaque session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: Credentials accepted and HttpOnly session cookie issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          description: Too many failed attempts for this canonical email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the user represented by the session cookie
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Revoke the current session and clear its cookie
      responses:
        '204':
          description: Session absent or revoked
  /v1/provider-credentials:
    get:
      tags: [Provider Credentials]
      operationId: listProviderCredentials
      summary: List configured Provider IDs and timestamps without key material
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Credential metadata owned by the current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProviderCredentialSummary'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /v1/provider-credentials/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    put:
      tags: [Provider Credentials]
      operationId: putProviderCredential
      summary: Encrypt and replace one Provider API key
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCredentialWrite'
      responses:
        '200':
          description: Credential encrypted and stored; plaintext is never returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProviderCredentialSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
    delete:
      tags: [Provider Credentials]
      operationId: deleteProviderCredential
      summary: Delete one Provider API key owned by the current user
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Credential absent or deleted
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /v1/chat:
    post:
      tags: [Resume Agent]
      operationId: chatWithResumeAgent
      security:
        - sessionCookie: []
      summary: Chat with the resume agent without uploading files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Assistant reply
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '502':
          $ref: '#/components/responses/LlmRequestFailed'
        '503':
          $ref: '#/components/responses/LlmNotConfigured'
  /v1/tailor-resume:
    post:
      tags: [Resume Agent]
      operationId: tailorResume
      security:
        - sessionCookie: []
      summary: Generate grounded resume variants for a job description
      description: |
        Runs input extraction, optional candidate normalization, JD analysis,
        evidence matching, drafting, deterministic validation, quality checks,
        and multi-format rendering. Use JSON for API clients and multipart for
        browser uploads. This synchronous endpoint is retained for development
        and simple clients; use the run-oriented protocol for long workflows.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TailorResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TailorResumeMultipartRequest'
            encoding:
              jobFiles:
                contentType: application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.oasis.opendocument.text, application/rtf, text/plain, text/markdown, image/png, image/jpeg, image/webp
              candidateFiles:
                contentType: application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.oasis.opendocument.text, application/rtf, text/plain, text/markdown, image/png, image/jpeg, image/webp
      responses:
        '200':
          description: Tailoring workflow completed; individual artifact failures are reported in the result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TailorResumeResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/AgentValidationFailed'
        '502':
          $ref: '#/components/responses/LlmRequestFailed'
        '503':
          $ref: '#/components/responses/LlmNotConfigured'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/runs:
    post:
      tags: [Resume Agent]
      operationId: createResumeRun
      security:
        - sessionCookie: []
      summary: Queue an asynchronous resume-tailoring run
      description: |
        Validates the request before creating a run, then returns the queued
        run immediately. Poll GET /v1/runs/{id} for stage changes and the
        terminal result. The current in-memory store is intended for local
        development and does not survive process restarts.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TailorResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TailorResumeMultipartRequest'
      responses:
        '202':
          description: Run accepted and queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResumeAgentRun'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/runs/{id}:
    get:
      tags: [Resume Agent]
      operationId: getResumeRun
      security:
        - sessionCookie: []
      summary: Get the latest public snapshot of a resume-tailoring run
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest run stage, terminal result, or safe failure
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResumeAgentRun'
        '404':
          description: No run exists for this ID in the current store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/runs/{id}/answers:
    post:
      tags: [Resume Agent]
      operationId: answerResumeRunInteraction
      security:
        - sessionCookie: []
      summary: Answer the currently active structured interaction
      description: |
        Validates the answer, applies it to the stored checkpoint, and either
        exposes the next focused interaction or resumes from the next required
        workflow stage. Idempotency keys are scoped to the run.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionAnswer'
          multipart/form-data:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  allOf:
                    - $ref: '#/components/schemas/InteractionAnswer'
                  description: >-
                    JSON-encoded answer. A `file`-control value references
                    uploaded parts by fileId, e.g.
                    `[{"fileId":"answer-1","mediaType":"text/plain"}]`.
            encoding:
              answer:
                contentType: application/json
            description: >-
              Required when the active interaction's control type is `file`:
              every referenced binary rides along as a `file:<fileId>` part
              in the same request. The server ingests the uploaded files,
              re-normalizes the candidate profile from the full material set,
              and resumes the run. A JSON body is still accepted for every
              non-file control.
      responses:
        '202':
          description: Answer accepted; the run is paused again or resuming
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResumeAgentRun'
        '400':
          description: Answer body or control-specific value is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No run exists for this ID in the current store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Run state, interaction ID, or idempotency key conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yamlresume_session
      description: HttpOnly opaque session token; production uses the __Host- prefix
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-provided correlation ID, truncated to 128 characters
      schema:
        type: string
        maxLength: 128
  responses:
    AuthenticationRequired:
      description: A valid, unexpired session cookie is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidRequest:
      description: Request body, multipart form, file, or schema is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: Content-Type is not application/json or multipart/form-data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentValidationFailed:
      description: Candidate or generated resume failed deterministic validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    LlmRequestFailed:
      description: Model provider request failed or returned unusable output
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    LlmNotConfigured:
      description: Server model credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 20000
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 20000
        history:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ChatMessage'
        context:
          type: string
          maxLength: 100000
    ChatResponse:
      type: object
      additionalProperties: false
      required: [reply, readyToGenerate]
      properties:
        reply:
          type: string
          minLength: 1
          maxLength: 20000
        readyToGenerate:
          type: boolean
    AuthCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        expiresAt:
          type: string
          format: date-time
    ProviderCredentialWrite:
      type: object
      additionalProperties: false
      required: [apiKey]
      properties:
        apiKey:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
    ProviderCredentialSummary:
      type: object
      additionalProperties: false
      required: [providerId, createdAt, updatedAt]
      properties:
        providerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiMeta:
      type: object
      required: [apiVersion, requestId]
      properties:
        apiVersion:
          type: string
          const: v1
        requestId:
          type: string
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ApiMeta'
    ErrorDetail:
      type: object
      required: [message]
      properties:
        path:
          type: string
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_registration
                - user_exists
                - invalid_credentials
                - login_rate_limited
                - not_authenticated
                - invalid_provider_credential
                - authentication_disabled
                - authentication_failed
                - origin_not_allowed
                - invalid_answer
                - not_found
                - run_not_found
                - run_not_waiting_for_input
                - stale_interaction
                - idempotency_conflict
                - run_checkpoint_missing
                - answer_failed
                - agent_validation_failed
                - llm_not_configured
                - llm_request_failed
                - structured_output_validation_failed
                - unsupported_file_type
                - file_type_mismatch
                - invalid_file_encoding
                - corrupt_document
                - encrypted_document
                - document_limit_exceeded
                - document_extraction_failed
                - empty_extracted_text
                - agent_failed
            message:
              type: string
            stage:
              type: string
              description: Safe workflow stage for validation failures; never contains input or provider output.
              enum:
                - candidate_input
                - candidate_normalization
                - draft_validation
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    InputFile:
      type: object
      required: [filename]
      properties:
        id:
          type: string
          maxLength: 128
        filename:
          type: string
          maxLength: 255
        mediaType:
          type: string
          maxLength: 128
        text:
          type: string
          maxLength: 1000000
        contentBase64:
          type: string
          maxLength: 20000000
      oneOf:
        - required: [text]
        - required: [contentBase64]
    CandidateInput:
      type: object
      properties:
        yaml:
          type: string
          maxLength: 500000
        resume:
          type: object
          additionalProperties: true
          description: YAMLResume-compatible object
        files:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/InputFile'
      anyOf:
        - required: [yaml]
        - required: [resume]
        - required: [files]
    TailorPreferences:
      type: object
      properties:
        language:
          type: string
          maxLength: 32
        targetTitle:
          type: string
          maxLength: 200
        maxPages:
          type: integer
          enum: [1, 2]
        template:
          type: string
          enum: [jake, moderncv-banking, moderncv-casual, moderncv-classic, deedy]
          deprecated: true
          description: Legacy single-template preference; styles should be used by new clients
        styles:
          type: array
          minItems: 1
          maxItems: 5
          default: [ats-compact]
          items:
            $ref: '#/components/schemas/StylePresetId'
        formats:
          type: array
          minItems: 1
          maxItems: 10
          default: [yaml, json, markdown, html, latex]
          items:
            $ref: '#/components/schemas/OutputFormat'
    TailorResumeRequest:
      type: object
      required: [candidate]
      properties:
        jobDescription:
          type: string
          minLength: 20
          maxLength: 100000
        jobFiles:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/InputFile'
        candidate:
          $ref: '#/components/schemas/CandidateInput'
        preferences:
          $ref: '#/components/schemas/TailorPreferences'
      anyOf:
        - required: [jobDescription]
        - required: [jobFiles]
    TailorResumeMultipartRequest:
      type: object
      properties:
        jobDescription:
          type: string
          description: Optional direct JD text
        candidate:
          type: string
          description: JSON string containing candidate.yaml or candidate.resume
        preferences:
          type: string
          description: JSON string matching TailorPreferences
        jobFiles:
          type: array
          maxItems: 8
          items:
            type: string
            format: binary
        candidateFiles:
          type: array
          maxItems: 12
          items:
            type: string
            format: binary
    StylePresetId:
      type: string
      enum:
        - ats-compact
        - modern-professional
        - modern-classic
        - modern-casual
        - developer-two-column
    OutputFormat:
      type: string
      enum: [yaml, json, markdown, html, latex, pdf, docx, txt, rtf, odt]
    JobRequirement:
      type: object
      required: [id, text, keywords, importance, category]
      properties:
        id: { type: string }
        text: { type: string }
        keywords:
          type: array
          items: { type: string }
        importance:
          type: string
          enum: [must-have, nice-to-have]
        category:
          type: string
          enum: [technical, domain, responsibility, soft-skill, other]
    JobSpec:
      type: object
      required: [targetTitle, seniority, summary, requirements, keywords]
      properties:
        targetTitle: { type: string }
        seniority:
          type: string
          enum: [intern, junior, mid, senior, lead, unknown]
        company: { type: string }
        summary: { type: string }
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/JobRequirement'
        keywords:
          type: array
          items: { type: string }
    RequirementMatch:
      type: object
      required: [requirementId, requirement, status, evidenceIds, rationale]
      properties:
        requirementId: { type: string }
        requirement: { type: string }
        status:
          type: string
          enum: [matched, partial, missing]
        evidenceIds:
          type: array
          items: { type: string }
        rationale: { type: string }
    MatchReport:
      type: object
      required: [score, matchedRequirements, missingRequirements, selectedEvidenceIds]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        matchedRequirements:
          type: array
          items:
            $ref: '#/components/schemas/RequirementMatch'
        missingRequirements:
          type: array
          items:
            $ref: '#/components/schemas/RequirementMatch'
        selectedEvidenceIds:
          type: array
          items: { type: string }
    ResumeChange:
      type: object
      required: [type, path, section]
      properties:
        type:
          type: string
          enum: [added, removed, changed, reordered]
        path: { type: string }
        section: { type: string }
        before: {}
        after: {}
    ResumeDiff:
      type: object
      required: [changes, counts]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ResumeChange'
        counts:
          type: object
          required: [added, removed, changed, reordered]
          properties:
            added: { type: integer }
            removed: { type: integer }
            changed: { type: integer }
            reordered: { type: integer }
    QualityWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string }
        severity:
          type: string
          enum: [info, warning]
        message: { type: string }
    QualityReport:
      type: object
      required: [requirementCoverage, mustHaveCoverage, keywordCoverage, matchedKeywords, missingKeywords, missingMustHave, warnings]
      properties:
        requirementCoverage: { type: number, minimum: 0, maximum: 1 }
        mustHaveCoverage: { type: number, minimum: 0, maximum: 1 }
        keywordCoverage: { type: number, minimum: 0, maximum: 1 }
        matchedKeywords:
          type: array
          items: { type: string }
        missingKeywords:
          type: array
          items: { type: string }
        missingMustHave:
          type: array
          items: { type: string }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/QualityWarning'
    FollowUpQuestion:
      type: object
      required: [field, question, reason, severity]
      properties:
        field: { type: string }
        question: { type: string }
        reason: { type: string }
        severity:
          type: string
          enum: [blocking, important, optional]
        control:
          $ref: '#/components/schemas/InteractionControl'
    InteractionChoiceOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string, maxLength: 500 }
        label: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 500 }
        recommended: { type: boolean }
    InteractionControl:
      oneOf:
        - type: object
          required: [type, minLength, maxLength]
          properties:
            type: { type: string, const: text }
            minLength: { type: integer, minimum: 0, maximum: 500 }
            maxLength: { type: integer, minimum: 1, maximum: 10000 }
        - type: object
          required: [type, minLength, maxLength]
          properties:
            type: { type: string, const: textarea }
            minLength: { type: integer, minimum: 0, maximum: 5000 }
            maxLength: { type: integer, minimum: 1, maximum: 50000 }
        - type: object
          required: [type, options, allowCustom]
          properties:
            type: { type: string, const: single_choice }
            options:
              type: array
              minItems: 2
              maxItems: 5
              items:
                $ref: '#/components/schemas/InteractionChoiceOption'
            allowCustom: { type: boolean }
        - type: object
          required: [type, options, allowCustom, minSelections, maxSelections]
          properties:
            type: { type: string, const: multi_choice }
            options:
              type: array
              minItems: 2
              maxItems: 5
              items:
                $ref: '#/components/schemas/InteractionChoiceOption'
            allowCustom: { type: boolean }
            minSelections: { type: integer, minimum: 0, maximum: 5 }
            maxSelections: { type: integer, minimum: 1, maximum: 5 }
        - type: object
          required: [type]
          properties:
            type: { type: string, const: number }
            min: { type: number }
            max: { type: number }
            integer: { type: boolean }
        - type: object
          description: Day-precision ISO date only; year/month precision is deferred.
          required: [type]
          properties:
            type: { type: string, const: date }
            min: { type: string, format: date }
            max: { type: string, format: date }
        - type: object
          description: Day-precision ISO date range; the end may be omitted when allowed.
          required: [type, allowOpenEnd]
          properties:
            type: { type: string, const: date_range }
            min: { type: string, format: date }
            max: { type: string, format: date }
            allowOpenEnd: { type: boolean }
        - type: object
          required: [type, maxLength]
          properties:
            type: { type: string, const: url }
            maxLength: { type: integer, minimum: 1, maximum: 5000 }
        - type: object
          description: References files already uploaded by an external file service; this endpoint does not upload binary content.
          required: [type, acceptedMediaTypes, maxFiles]
          properties:
            type: { type: string, const: file }
            acceptedMediaTypes:
              type: array
              minItems: 1
              maxItems: 12
              items: { type: string }
            maxFiles: { type: integer, minimum: 1, maximum: 12 }
        - type: object
          required: [type]
          properties:
            type: { type: string, const: confirm }
            confirmLabel: { type: string, maxLength: 100 }
            cancelLabel: { type: string, maxLength: 100 }
      discriminator:
        propertyName: type
    InteractionRequest:
      type: object
      required: [id, field, prompt, reason, required, severity, privacy, control]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        field: { type: string, minLength: 1, maxLength: 500 }
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        required: { type: boolean }
        severity:
          type: string
          enum: [blocking, important, optional]
        privacy:
          type: string
          enum: [standard, personal, sensitive]
        control:
          $ref: '#/components/schemas/InteractionControl'
    InteractionAnswer:
      type: object
      required: [interactionId, idempotencyKey, value]
      properties:
        interactionId: { type: string, minLength: 1, maxLength: 200 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        value:
          description: Value validated against the active interaction control
    AgentTraceEvent:
      type: object
      required: [name, status, at]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [started, completed, failed]
        at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
    OutputArtifact:
      type: object
      required: [format, style, filename, mediaType, encoding, content, sizeBytes]
      properties:
        format:
          $ref: '#/components/schemas/OutputFormat'
        style:
          $ref: '#/components/schemas/StylePresetId'
        filename: { type: string }
        mediaType: { type: string }
        encoding:
          type: string
          enum: [utf8, base64]
        content:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
    ArtifactFailure:
      type: object
      required: [format, style, code, message]
      properties:
        format:
          $ref: '#/components/schemas/OutputFormat'
        style:
          $ref: '#/components/schemas/StylePresetId'
        code: { type: string }
        message: { type: string }
    RenderedResume:
      type: object
      required: [artifacts, failures]
      properties:
        yaml: { type: string }
        json: { type: string }
        markdown: { type: string }
        html: { type: string }
        latex: { type: string }
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/OutputArtifact'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactFailure'
    RenderedVariant:
      type: object
      required: [style, label, template, artifacts, failures]
      properties:
        style:
          $ref: '#/components/schemas/StylePresetId'
        label: { type: string }
        template: { type: string }
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/OutputArtifact'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactFailure'
    TailorResumeResult:
      type: object
      required: [status, jobSpec, matchReport, diff, quality, resume, rendered, variants, questions, warnings, trace]
      properties:
        status:
          type: string
          const: completed
        jobSpec:
          $ref: '#/components/schemas/JobSpec'
        matchReport:
          $ref: '#/components/schemas/MatchReport'
        diff:
          $ref: '#/components/schemas/ResumeDiff'
        quality:
          $ref: '#/components/schemas/QualityReport'
        resume:
          type: object
          additionalProperties: true
          description: Validated YAMLResume object
        rendered:
          $ref: '#/components/schemas/RenderedResume'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/RenderedVariant'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/FollowUpQuestion'
        warnings:
          type: array
          items: { type: string }
        trace:
          type: array
          items:
            $ref: '#/components/schemas/AgentTraceEvent'
    AgentRunStatus:
      type: string
      enum:
        - queued
        - ingesting_inputs
        - normalizing_candidate
        - needs_input
        - analyzing_jd
        - matching_evidence
        - drafting
        - validating
        - rendering
        - completed
        - failed
    AgentRunFailure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Stable, data-safe message without source content or raw model output
    ResumeAgentRun:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        interactions:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/InteractionRequest'
        result:
          description: Completed user artifact, including the tailored resume and rendered output; absent before completion.
          $ref: '#/components/schemas/TailorResumeResult'
        error:
          $ref: '#/components/schemas/AgentRunFailure'
    Capabilities:
      type: object
      required: [apiVersion, endpoints, input, output, runtime]
      properties:
        apiVersion: { type: string }
        endpoints:
          type: object
          additionalProperties: { type: string }
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        runtime:
          type: object
          required: [providerConfigured, runStore, authentication]
          properties:
            providerConfigured: { type: boolean }
            runStore: { type: string, enum: [memory, sqlite] }
            authentication: { type: string, enum: [enabled, disabled] }
